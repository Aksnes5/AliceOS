  <rect width="2560" height="1440" fill="url(#bs-sky)" />

  <!-- Big Sur Curving Mountains -->
  <path d="M 0 650 C 600 550, 1100 750, 1600 600 C 2100 480, 2350 540, 2560 480 L 2560 1440 L 0 1440 Z" fill="url(#bs-navy)" opacity="0.85" />

  <path d="M 0 780 C 500 700, 1000 850, 1500 720 C 2000 580, 2300 660, 2560 580 L 2560 1440 L 0 1440 Z" fill="url(#bs-teal)" filter="url(#bs-shadow)" />

  <path d="M 0 940 C 600 860, 1100 1020, 1700 850 C 2150 720, 2400 800, 2560 720 L 2560 1440 L 0 1440 Z" fill="url(#bs-coral)" filter="url(#bs-shadow)" />

  <path d="M 0 1120 C 500 1020, 1050 1180, 1600 1000 C 2100 850, 2350 940, 2560 880 L 2560 1440 L 0 1440 Z" fill="url(#bs-orange)" filter="url(#bs-shadow)" />
