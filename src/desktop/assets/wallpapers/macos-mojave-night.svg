<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="moj-night-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="night-dune1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="night-dune2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="stars-glow">
      <feGaussianBlur stdDeviation="1.5" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#moj-night-sky)" />

  <!-- Constellations & Stars -->
  <g fill="#ffffff" filter="url(#stars-glow)">
    <circle cx="320" cy="140" r="2" opacity="0.9" /><circle cx="540" cy="280" r="1.4" opacity="0.7" />
    <circle cx="820" cy="180" r="2.2" opacity="0.95" /><circle cx="1120" cy="110" r="1.6" opacity="0.8" />
    <circle cx="1460" cy="220" r="1.8" opacity="0.85" /><circle cx="1780" cy="90" r="2.5" opacity="1" />
    <circle cx="2040" cy="260" r="1.5" opacity="0.7" /><circle cx="2320" cy="150" r="2" opacity="0.9" />
    <circle cx="680" cy="380" r="1.2" opacity="0.6" /><circle cx="1280" cy="320" r="1.5" opacity="0.75" />
    <circle cx="1920" cy="360" r="1.3" opacity="0.65" />
  </g>

  <!-- Moonlight Dunes -->
  <path d="M 0 950 C 400 850, 900 920, 1400 820 C 1900 720, 2200 800, 2560 750 L 2560 1440 L 0 1440 Z" fill="url(#night-dune1)" opacity="0.7" />
  <path d="M 0 1080 C 500 920, 1100 1120, 1650 940 C 2100 800, 2350 900, 2560 840 L 2560 1440 L 0 1440 Z" fill="url(#night-dune2)" />
  <path d="M 0 1250 C 450 1100, 950 1300, 1500 1120 C 1950 960, 2300 1100, 2560 1020 L 2560 1440 L 0 1440 Z" fill="#090d16" />
</svg>