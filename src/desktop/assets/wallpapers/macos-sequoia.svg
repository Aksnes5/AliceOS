<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="seq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f18" />
      <stop offset="45%" stop-color="#0a3225" />
      <stop offset="75%" stop-color="#09241c" />
      <stop offset="100%" stop-color="#02120e" />
    </linearGradient>
    <radialGradient id="seq-sun" cx="68%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fb8500" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#c1121f" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#0a3225" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005f73" />
      <stop offset="50%" stop-color="#0a9396" />
      <stop offset="100%" stop-color="#94d2bd" />
    </linearGradient>
    <linearGradient id="ring-g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b2226" />
      <stop offset="40%" stop-color="#ae2012" />
      <stop offset="80%" stop-color="#bb3e03" />
      <stop offset="100%" stop-color="#ca6702" />
    </linearGradient>
    <linearGradient id="ring-g3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e9d8a6" />
      <stop offset="50%" stop-color="#ee9b00" />
      <stop offset="100%" stop-color="#ca6702" />
    </linearGradient>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="2560" height="1440" fill="url(#seq-bg)" />

  <!-- Ambient Redwood Glow -->
  <circle cx="1740" cy="620" r="950" fill="url(#seq-sun)" />

  <!-- Abstract Forest Ring Topography Waves -->
  <g opacity="0.88">
    <!-- Outer Deep Pine Ring -->
    <path d="M -100 1550 C 400 1300, 800 1450, 1200 1200 C 1600 950, 1900 1050, 2660 700 L 2660 1550 Z" fill="#042a20" opacity="0.95" />
    
    <!-- Deep Emerald Contour -->
    <path d="M -100 1250 C 350 1000, 750 1150, 1150 900 C 1550 650, 1850 780, 2660 500 L 2660 1550 L -100 1550 Z" fill="#084c37" opacity="0.85" />

    <!-- Radiant Amber & Terracotta Ring Contour -->
    <path d="M -100 950 C 400 720, 850 880, 1300 620 C 1750 360, 2050 500, 2660 300 L 2660 1550 L -100 1550 Z" fill="url(#ring-g2)" opacity="0.8" />

    <!-- Bright Sunburst Ring Blade -->
    <path d="M -50 780 C 450 520, 920 690, 1420 450 C 1820 250, 2150 380, 2660 180 L 2660 900 C 2100 950, 1700 800, 1300 980 C 850 1180, 400 1000, -50 1200 Z" fill="url(#ring-g3)" opacity="0.92" filter="url(#glow)" />

    <!-- Redwood Concentric Rings (Sequoia Signature) -->
    <ellipse cx="1780" cy="580" rx="420" ry="260" fill="none" stroke="#ffe3a0" stroke-width="4" opacity="0.3" transform="rotate(-15 1780 580)" />
    <ellipse cx="1780" cy="580" rx="560" ry="350" fill="none" stroke="#fca311" stroke-width="3" opacity="0.25" transform="rotate(-15 1780 580)" />
    <ellipse cx="1780" cy="580" rx="720" ry="460" fill="none" stroke="#94d2bd" stroke-width="2.5" opacity="0.2" transform="rotate(-15 1780 580)" />
    <ellipse cx="1780" cy="580" rx="900" ry="580" fill="none" stroke="#e76f51" stroke-width="2" opacity="0.18" transform="rotate(-15 1780 580)" />
    <ellipse cx="1780" cy="580" rx="1120" ry="720" fill="none" stroke="#0a9396" stroke-width="2" opacity="0.15" transform="rotate(-15 1780 580)" />

    <!-- Crest Stream Teal Highlight -->
    <path d="M 0 620 C 500 400, 1000 560, 1500 320 C 1900 130, 2250 240, 2600 80 L 2600 200 C 2200 340, 1850 240, 1480 420 C 950 640, 480 480, 0 700 Z" fill="url(#ring-g1)" opacity="0.65" />
  </g>

  <!-- Atmospheric Deep Mist Vignette -->
  <rect width="2560" height="1440" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="80" opacity="0.6" />
</svg>