<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="100%" height="100%">
  <defs>
    <linearGradient id="moj-day-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#93c5fd" />
      <stop offset="95%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="dune-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="dune-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="dune-drop">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#moj-day-sky)" />

  <!-- Distant Dunes -->
  <path d="M 0 950 C 400 850, 900 920, 1400 820 C 1900 720, 2200 800, 2560 750 L 2560 1440 L 0 1440 Z" fill="url(#dune-shadow)" opacity="0.65" />

  <!-- Mid Dune Crest (Sun Side) -->
  <path d="M 0 1080 C 500 920, 1100 1120, 1650 940 C 2100 800, 2350 900, 2560 840 L 2560 1440 L 0 1440 Z" fill="url(#dune-sun)" filter="url(#dune-drop)" />

  <!-- Foreground Dune Ridge (Shadow Side) -->
  <path d="M 0 1250 C 450 1100, 950 1300, 1500 1120 C 1950 960, 2300 1100, 2560 1020 L 2560 1440 L 0 1440 Z" fill="url(#dune-shadow)" opacity="0.9" />
</svg>